<!doctype html>
<html lang="en" data-theme="employee">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#16a34a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>CultivAI Employee</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Service worker is PRODUCTION-only. In dev (vite on :5174) the SW
      // has historically cached /src/* modules and caused phantom stale-code
      // bugs — see commits that follow 2ae96f0. If a SW was previously
      // registered in dev, unregister it on the next page load.
      if ('serviceWorker' in navigator) {
        const isProd = location.hostname !== 'localhost' && location.hostname !== '127.0.0.1'
        if (isProd) {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js').catch(() => {})
          })
        } else {
          navigator.serviceWorker.getRegistrations()
            .then((regs) => regs.forEach((r) => r.unregister()))
            .catch(() => {})
        }
      }
    </script>
  </body>
</html>
